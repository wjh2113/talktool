# TalkTool H5 + API
# talk.aidigitcloud.cn → 静态页 + /media/audio 直接读磁盘，/api 反代到 127.0.0.1:8793

server {
    listen 80;
    server_name talk.aidigitcloud.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name talk.aidigitcloud.cn;

    ssl_certificate /etc/nginx/ssl/aidigitcloud.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/aidigitcloud.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 30m;
    proxy_connect_timeout 30s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    location /api/ {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # 语音文件由 nginx 直接读磁盘，不经过 Python 后端（文件名带随机串/哈希，内容不会变）
    location /media/audio/ {
        alias /opt/talktool/backend/data/audio/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        types { audio/mpeg mp3; }
        default_type audio/mpeg;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        root /opt/talktool/frontend/dist;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /sw.js {
        root /opt/talktool/frontend/dist;
        add_header Cache-Control "no-cache";
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        root /opt/talktool/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
}
